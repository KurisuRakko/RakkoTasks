<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f9f8f5" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- 壁纸首帧上屏：React 挂载前先把 localStorage 里已有的壁纸写到 <html>，没有则写默认
         壁纸——两者都不写的话首屏会先闪一下没有背景的纯纸色。存储键、变量名与默认图地址
         必须与 src/lib/glass.ts、src/lib/wallpaper.tsx 保持一致（那边是常量；本脚本在模块
         系统之外只能手抄，tests/wallpaper.test.tsx 会断言两处一致）。 -->
    <script>
      try {
        var w = localStorage.getItem('rakkotasks.wallpaper');
        document.documentElement.style.setProperty(
          '--rtk-wallpaper',
          w ? 'url("' + w + '")' : 'url("/wallpaper-default.jpg")',
        );
      } catch (e) {}
    </script>
    <title>RakkoTasks</title>
  </head>
  <body>
    <!-- 壁纸承载层：整页不透明地板（纸色 + 用户壁纸原图），一个真实 DOM 节点。
         样式由 theme.ts 的 CssBaseline 按 #rtk-wallpaper 下发（常量 WALLPAPER_LAYER_ID；
         本文件在模块系统之外只能手抄，tests/wallpaper.test.tsx 会断言两处一致）。 -->
    <div id="rtk-wallpaper"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
