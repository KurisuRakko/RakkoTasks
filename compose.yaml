# RakkoTasks 生产部署（单机，Debian 13 trixie + Docker Compose 插件）。
# 用法（部署目录 /srv/rakkotasks）：docker compose up -d --build
# 配置来源：部署目录下的 .env（cp deploy/.env.example .env）。
#
# 公网入口由宿主机的 cloudflared systemd 服务统一提供，ingress 规则写在
# /etc/cloudflared/config.yml；本文件只需把 web 发布到 127.0.0.1:8000 供其取数据。
#
# 本文件放在仓库根而不是 deploy/ 下，是为了让服务器上的 Dockge 能把整个仓库识别成
# 一个栈 —— Dockge 只认栈目录根的 compose.yaml。服务器上 /opt/stacks/rakkotasks
# 是指向本仓库的软链接，因此这里的相对路径都相对仓库根解析。
name: rakkotasks

services:
  # FastAPI：REST API + 托管前端 SPA；仅绑定本机回环，公网走宿主机的 cloudflared 隧道
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: rakkotasks:latest
    restart: unless-stopped
    env_file:
      # 仓库根 .env（gitignore，新克隆的仓库里不存在）；required:false 让
      # config/up 在未创建 .env 时也能通过，缺失时用镜像内置默认值
      - path: .env
        required: false
    environment:
      - DATABASE_PATH=/data/rakkotasks.db
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"

  # 定时同步 worker：与 web 同镜像，仅命令不同
  worker:
    image: rakkotasks:latest
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_PATH=/data/rakkotasks.db
      - EMAIL_ARCHIVE_DIR=/archive
    volumes:
      - ./data:/data
      # 宿主机归档目录，须预先创建并归 uid 1000 所有（见 deploy/README.md）
      - ${EMAIL_ARCHIVE_HOST_DIR:-./data/archive}:/archive
